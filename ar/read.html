<script>
(function(){
  var strip=document.getElementById('strip'),pgs=[].slice.call(strip.querySelectorAll('.pg')),cur=document.getElementById('cur'),
      prev=document.getElementById('prev'),next=document.getElementById('next'),i=0;
  function upd(){cur.textContent=i+1;prev.disabled=i<=0;next.disabled=i>=pgs.length-1;}
  function go(n){n=Math.max(0,Math.min(pgs.length-1,n));var s=strip.getBoundingClientRect(),r=pgs[n].getBoundingClientRect();
    strip.scrollBy({left:r.left-s.left,behavior:'smooth'});i=n;upd();}
  prev.onclick=function(){go(i-1)};next.onclick=function(){go(i+1)};
  strip.addEventListener('keydown',function(e){var rtl=document.dir==='rtl';
    if(e.key==='ArrowRight'){e.preventDefault();go(rtl?i-1:i+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(rtl?i+1:i-1)}});
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.intersectionRatio>0.6){i=+x.target.dataset.i-1;upd();}})},{root:strip,threshold:[0.6]});
    pgs.forEach(function(p){io.observe(p)});}
  upd();
})();
</script>
