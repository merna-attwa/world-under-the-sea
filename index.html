<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Under the Sea · Choose your language</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Baloo+Bhaijaan+2:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#0e2d42;color:#fdf5e8;font-family:Fredoka,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.cover{width:140px;border-radius:10px;box-shadow:0 0 0 3px #f2c35f,0 12px 30px rgba(0,0,0,.45)}
h1{font-size:34px;margin:18px 0 6px;text-align:center}
p{color:#cfe3ea;margin:0 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:420px}
a{display:block;text-align:center;text-decoration:none;background:#f2c35f;color:#0e2d42;font-weight:700;font-size:22px;padding:16px;border-radius:14px;box-shadow:inset 0 -4px 0 #c9962f}
a[lang=ar]{font-family:"Baloo Bhaijaan 2",sans-serif}
</style>
</head>
<body>
<img class="cover" src="en/pages/p-01.jpg" alt="World Under the Sea">
<h1>World Under the Sea</h1>
<p>Choose your language</p>
<div class="grid">
<a href="en/" lang="en">English</a><a href="ar/" lang="ar">العربية</a>
<a href="fr/" lang="fr">Français</a><a href="de/" lang="de">Deutsch</a>
</div>
</body>
</html>
